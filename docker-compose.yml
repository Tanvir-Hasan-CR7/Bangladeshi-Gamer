version: '3.8'

services:
  ajlb-sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ajlb-external-sync
    restart: always
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=${MYSQL_HOST:-168.119.102.138}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-s168_MainStore}
      - MYSQL_USER=${MYSQL_USER:-u168_50U0Rj2EOa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_TABLE=${SUPABASE_TABLE:-minecraft_leaderboards}
      - SUPABASE_SYNC_TOKEN=${SUPABASE_SYNC_TOKEN:-ajlb-sync-token-secret-2026}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-60}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-100}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
